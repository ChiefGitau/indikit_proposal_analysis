[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoa-indicator-pipeline"
version = "0.1.0"
description = "ESGReveal-style extraction of ZOA IndiKit indicators from project documents"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.setuptools.package-data]
"pipeline.metadata" = ["*.jsonl", "*.yaml", "*.json"]
"pipeline.eval" = ["gold/*.csv", "gold/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider -m 'not integration'"
markers = ["integration: needs the built knowledge bases and cached models (run with -m integration)"]
